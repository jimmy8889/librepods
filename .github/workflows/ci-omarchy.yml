name: Build Omarchy package
on:
  push:
    branches: ['codex/desktop-windows-omarchy']
    paths: ['linux/**', 'packaging/omarchy/**', '.github/workflows/ci-omarchy.yml']
  pull_request:
    paths: ['linux/**', 'packaging/omarchy/**', '.github/workflows/ci-omarchy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git cmake ninja qt6-base qt6-declarative qt6-connectivity qt6-wayland qt6-tools openssl libpulse bluez python
      - uses: actions/checkout@v4
      - name: Build and check package as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --noconfirm -p packaging/omarchy/PKGBUILD"
      - uses: actions/upload-artifact@v4
        with:
          name: librepods-omarchy-x86_64
          path: '*.pkg.tar.zst'
          if-no-files-found: error
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path windows/daemon/Cargo.toml --lib --locked
